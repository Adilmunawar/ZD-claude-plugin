name: release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches bundle version
        run: |
          V=$(python3 -c "import json;print(json.load(open('plugins/zaraat-dost/.claude-plugin/plugin.json'))['version'])")
          T="${GITHUB_REF_NAME#v}"; case "$T" in *.*.*) ;; *.*) T="$T.0";; *) T="$T.0.0";; esac
          [ "$V" = "$T" ] || { echo "tag ${GITHUB_REF_NAME} (=$T) != bundle version $V"; exit 1; }
      - name: Extract changelog section
        run: |
          T="${GITHUB_REF_NAME#v}"; case "$T" in *.*.*) ;; *.*) T="$T.0";; esac
          awk -v v="$T" '/^## /{p=($2==v)} p' CHANGELOG.md > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with: { body_path: RELEASE_NOTES.md }
