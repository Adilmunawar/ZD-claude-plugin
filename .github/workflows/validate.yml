name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: bash scripts/validate.sh
      - name: Secrets audit (this repository)
        run: node plugins/zd-core/scripts/secrets-audit.js . --history --ignore=tests
      - name: Claude Code plugin validation (non-blocking)
        run: npm i -g @anthropic-ai/claude-code && claude plugin validate . || true
