name: secrets-scan
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fetch audit script from the toolkit
        run: |
          mkdir -p .zd && for f in patterns.js secrets-audit.js; do curl -fsSL https://raw.githubusercontent.com/adilmunawar/ZD-claude-plugin/main/plugins/zd-core/scripts/$f -o .zd/$f; done
      - run: node .zd/secrets-audit.js . --history --ignore=tests
      # Or, without fetching the raw scripts:
      # - run: npx -y github:Adilmunawar/ZD-claude-plugin secrets-audit . --history --ignore=tests
